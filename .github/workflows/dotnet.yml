# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore TicTacToe.Api/TicTacToe.slnx
    - name: Build
      run: dotnet build TicTacToe.Api/TicTacToe.slnx --no-restore
    - name: Test
      run: dotnet test TicTacToe.Api/TicTacToe.slnx --no-build --verbosity normal
    - name: Publish Backend
      run: dotnet publish TicTacToe.Api/TicTacToe.Api/TicTacToe.Api.csproj -c Release -o publish/backend
    - name: Upload Backend Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TicTacToe-Backend
        path: publish/backend
